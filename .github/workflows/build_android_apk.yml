name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - run: flutter create --project-name maas_sayaci --platforms=android .

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Add AdMob App ID to AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          app_id_meta = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-7094485651472008~1952328186"/>
          '''

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", app_id_meta + "\n    </application>")
              manifest.write_text(text)
          PY

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: maas-sayaci-aab
          path: build/app/outputs/bundle/release/app-release.aab
