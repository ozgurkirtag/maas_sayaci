name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Create Android project
        run: flutter create --project-name maassayaci --org com.kirtagapps --platforms=android .

      - name: Set Android SDK 35
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Add AdMob App ID
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          meta = """
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-7094485651472008~1952328186"/>
          """

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", meta + "\n    </application>")
              manifest.write_text(text)
          PY

      - name: Create upload keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass maas123456 \
            -keypass maas123456 \
            -dname "CN=Kirtag Apps, OU=Kirtag Apps, O=Kirtag Apps, L=Istanbul, S=Istanbul, C=TR"

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Remove debug signature if exists
        run: |
          zip -d build/app/outputs/bundle/release/app-release.aab "META-INF/*" || true

      - name: Sign AAB with upload key
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android/app/upload-keystore.jks \
            -storepass maas123456 \
            -keypass maas123456 \
            build/app/outputs/bundle/release/app-release.aab \
            upload

      - name: Verify release signature
        run: |
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab | grep "CN=Kirtag Apps"

      - uses: actions/upload-artifact@v4
        with:
          name: maas-sayaci-aab-release-signed-sdk35
          path: build/app/outputs/bundle/release/app-release.aab
