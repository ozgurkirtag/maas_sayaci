name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - run: flutter create --project-name maas_sayaci --platforms=android .

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Add AdMob App ID to AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          app_id_meta = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-7094485651472008~1952328186"/>
          '''

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", app_id_meta + "\n    </application>")
              manifest.write_text(text)
          PY

      - name: Create release keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass maas123456 \
            -keypass maas123456 \
            -dname "CN=Kirtag Apps, OU=Kirtag Apps, O=Kirtag Apps, L=Istanbul, S=Istanbul, C=TR"

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=maas123456
          keyPassword=maas123456
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Patch Gradle signing config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          if "keystoreProperties" not in text:
              text = text.replace(
                  "android {",
                  """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {"""
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          if "signingConfigs {" not in text:
              text = text.replace(
                  "defaultConfig {",
                  """signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                  storePassword keystoreProperties['storePassword']
              }
          }

              defaultConfig {"""
              )
          else:
              text = text.replace(
                  "signingConfigs {",
                  """signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                  storePassword keystoreProperties['storePassword']
              }"""
              )

          p.write_text(text)
          PY

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: maas-sayaci-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
