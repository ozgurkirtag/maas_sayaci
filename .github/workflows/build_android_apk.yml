name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - run: flutter create --project-name maas_sayaci --platforms=android .

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Create upload keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass maas123456 \
            -keypass maas123456 \
            -dname "CN=Kirtag Apps, OU=Kirtag Apps, O=Kirtag Apps, L=Istanbul, S=Istanbul, C=TR"

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=maas123456
          keyPassword=maas123456
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Patch Kotlin Gradle signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          if "val keystoreProperties" not in text:
              text = text.replace(
                  "plugins {",
                  """import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          plugins {"""
              )

          if "create(\"release\")" not in text:
              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """
              )

          text = text.replace(
              "signingConfig = signingConfigs.getByName(\"debug\")",
              "signingConfig = signingConfigs.getByName(\"release\")"
          )

          p.write_text(text)
          PY

      - name: Add AdMob App ID to AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          app_id_meta = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-7094485651472008~1952328186"/>
          '''

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", app_id_meta + "\n    </application>")
              manifest.write_text(text)
          PY

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: maas-sayaci-aab-release-signed
          path: build/app/outputs/bundle/release/app-release.aab
